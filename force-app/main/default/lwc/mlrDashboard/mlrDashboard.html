<template>
    <div class="mlr-app">
        <!-- Header -->
        <div class="mlr-header">
            <div class="mlr-header-inner">
                <lightning-icon icon-name="custom:custom63" size="medium" class="slds-m-right_small"></lightning-icon>
                <div>
                    <h1 class="mlr-title">MLR Pre-Screening Dashboard</h1>
                    <p class="mlr-subtitle">Medical · Legal · Regulatory AI-powered review</p>
                </div>
            </div>
        </div>

        <!-- Stats Row -->
        <div class="stats-grid slds-m-around_medium">
            <div class="stat-card stat-total">
                <p class="stat-num">{stats.total}</p>
                <p class="stat-lbl">Total Submissions</p>
            </div>
            <div class="stat-card stat-review">
                <p class="stat-num">{stats.inReview}</p>
                <p class="stat-lbl">In Review</p>
            </div>
            <div class="stat-card stat-prescreened">
                <p class="stat-num">{stats.preScreened}</p>
                <p class="stat-lbl">Pre-Screened</p>
            </div>
            <div class="stat-card stat-approved">
                <p class="stat-num">{stats.approved}</p>
                <p class="stat-lbl">Approved</p>
            </div>
            <div class="stat-card stat-rejected">
                <p class="stat-num">{stats.rejected}</p>
                <p class="stat-lbl">Rejected</p>
            </div>
            <div class="stat-card stat-revisions">
                <p class="stat-num">{stats.revisionsRequired}</p>
                <p class="stat-lbl">Revisions Required</p>
            </div>
        </div>

        <!-- Confidence Row -->
        <div class="confidence-row slds-m-horizontal_medium slds-m-bottom_medium">
            <span class="conf-badge conf-high">
                <lightning-icon icon-name="utility:success" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                High Confidence: {stats.highConfidence}
            </span>
            <span class="conf-badge conf-medium">
                <lightning-icon icon-name="utility:warning" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                Medium: {stats.mediumConfidence}
            </span>
            <span class="conf-badge conf-low">
                <lightning-icon icon-name="utility:error" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                Low: {stats.lowConfidence}
            </span>
        </div>

        <!-- Table + Actions -->
        <div class="slds-m-horizontal_medium">
            <div class="table-header">
                <h2 class="slds-text-heading_small">Recent Submissions</h2>
                <div class="action-buttons">
                    <lightning-button
                        label="Refresh"
                        icon-name="utility:refresh"
                        variant="neutral"
                        onclick={handleRefresh}
                        disabled={isLoading}>
                    </lightning-button>
                    <lightning-button
                        label="New Submission"
                        icon-name="utility:new"
                        variant="brand"
                        onclick={handleNewSubmission}
                        disabled={isLoading}
                        class="slds-m-left_small">
                    </lightning-button>
                </div>
            </div>

            <template if:true={isLoading}>
                <div class="slds-text-align_center slds-p-around_medium">
                    <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoading}>
                <lightning-datatable
                    data={submissions}
                    columns={columns}
                    key-field="Id"
                    hide-checkbox-column
                    class="mlr-table">
                </lightning-datatable>
            </template>
        </div>
    </div>

    <!-- New Submission Modal -->
    <template if:true={showSubmissionModal}>
        <div class="slds-backdrop slds-backdrop_open"></div>
        <section role="dialog" tabindex="-1" aria-modal="true"
                 class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            onclick={handleCloseModal} title="Close">
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title">New MLR Submission</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-flow
                        flow-api-name="MLR_Submission_Intake"
                        onstatuschange={handleFlowStatusChange}>
                    </lightning-flow>
                </div>
            </div>
        </section>
    </template>

</template>
